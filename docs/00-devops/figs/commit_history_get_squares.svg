<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Commit history for get_squares example">
  <defs>
    <style>
      .title { font: 700 20px Arial, sans-serif; fill: #1f2937; }
      .meta { font: 14px Arial, sans-serif; fill: #4b5563; }
      .hash { font: 700 13px monospace; fill: #111827; }
      .msg { font: 13px Arial, sans-serif; fill: #1f2937; }
      .code { font: 12px monospace; fill: #111827; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="260" fill="#f8fafc" />
  <text x="30" y="35" class="title">Git commit history for the get_squares example</text>
  <text x="30" y="58" class="meta">Old implementation is preserved in history while the latest code stays clean.</text>

  <line x1="120" y1="145" x2="780" y2="145" stroke="#94a3b8" stroke-width="4" />
  <circle cx="220" cy="145" r="11" fill="#0ea5e9" />
  <circle cx="520" cy="145" r="11" fill="#16a34a" />

  <text x="184" y="175" class="hash">a1b2c3d</text>
  <text x="484" y="175" class="hash">d4e5f6g</text>

  <rect x="110" y="85" width="230" height="46" rx="8" fill="#e0f2fe" stroke="#7dd3fc" />
  <text x="124" y="105" class="msg">Initial get_squares version</text>
  <text x="124" y="123" class="code">for n in numbers: result.append(n**2)</text>

  <rect x="410" y="85" width="300" height="46" rx="8" fill="#dcfce7" stroke="#86efac" />
  <text x="424" y="105" class="msg">Refactor to list comprehension</text>
  <text x="424" y="123" class="code">return [n ** 2 for n in numbers]</text>

  <rect x="470" y="190" width="288" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" />
  <text x="484" y="209" class="msg">Current file only keeps latest code.</text>
  <text x="484" y="226" class="msg">Git log preserves the previous implementation.</text>
</svg>
